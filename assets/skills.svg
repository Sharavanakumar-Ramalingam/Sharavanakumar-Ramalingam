<svg width="600" height="460" viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="smglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .outerspin{ transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
      @keyframes spin{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
      .web{ animation: fadegrid 1s ease forwards; opacity:0; }
      @keyframes fadegrid{ to{ opacity:1 } }
      .datapoly{ filter:url(#smglow); }
      .vertex{ opacity:0; animation: vertexpop .4s ease forwards; }
      @keyframes vertexpop{ to{ opacity:1 } }
      .vertex circle{ animation: vpulse 2.2s ease-in-out infinite; animation-delay: 2.4s; }
      @keyframes vpulse{ 0%,100%{ opacity:.7 } 50%{ opacity:1 } }
      .label{ opacity:0; animation: fadein .5s ease forwards; animation-delay: 2.3s; }
      @keyframes fadein{ to{ opacity:1 } }
      .title{ opacity:0; animation: fadein .6s ease forwards; animation-delay: 0s; }
      .summary{ opacity:0; animation: fadein .6s ease forwards; animation-delay: 2.6s; }
    </style>
  </defs>

  <rect width="600" height="460" fill="#050814"/>

  <g class="outerspin">
    <circle cx="300" cy="230" r="205" fill="none" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 10"/>
  </g>

  <text class="title" x="300" y="24" text-anchor="middle" fill="#00fff2" font-size="14" filter="url(#smglow)">SKILL MATRIX</text>

  <g class="web">
    <polygon points="300,200 328.5,220.7 317.6,254.3 282.4,254.3 271.5,220.7" fill="none" stroke="#00fff2" stroke-opacity="0.15"/>
    <polygon points="300,170 357.1,211.5 335.3,278.5 264.7,278.5 242.9,211.5" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
    <polygon points="300,140 385.6,202.2 352.9,302.8 247.1,302.8 214.4,202.2" fill="none" stroke="#00fff2" stroke-opacity="0.17"/>
    <polygon points="300,110 414.1,192.9 370.5,327.1 229.5,327.1 185.9,192.9" fill="none" stroke="#00fff2" stroke-opacity="0.19"/>
    <polygon points="300,80 442.7,183.6 388.2,351.4 211.8,351.4 157.3,183.6" fill="none" stroke="#00fff2" stroke-opacity="0.22"/>

    <line x1="300" y1="230" x2="300" y2="80" stroke="#00fff2" stroke-opacity="0.15"/>
    <line x1="300" y1="230" x2="442.7" y2="183.6" stroke="#00fff2" stroke-opacity="0.15"/>
    <line x1="300" y1="230" x2="388.2" y2="351.4" stroke="#00fff2" stroke-opacity="0.15"/>
    <line x1="300" y1="230" x2="211.8" y2="351.4" stroke="#00fff2" stroke-opacity="0.15"/>
    <line x1="300" y1="230" x2="157.3" y2="183.6" stroke="#00fff2" stroke-opacity="0.15"/>
  </g>

  <polygon class="datapoly" points="300,230 300,230 300,230 300,230 300,230" fill="url(#fillGrad)" stroke="#00fff2" stroke-width="2">
    <animate attributeName="points" from="300,230 300,230 300,230 300,230 300,230" to="300,87.5 414.1,192.9 374.9,333.1 238.3,314.9 193.0,195.2" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </polygon>

  <g class="vertex" style="animation-delay:2.1s"><circle cx="300" cy="87.5" r="5" fill="#00fff2" filter="url(#smglow)"/></g>
  <g class="vertex" style="animation-delay:2.15s"><circle cx="414.1" cy="192.9" r="5" fill="#00fff2" filter="url(#smglow)"/></g>
  <g class="vertex" style="animation-delay:2.2s"><circle cx="374.9" cy="333.1" r="5" fill="#00fff2" filter="url(#smglow)"/></g>
  <g class="vertex" style="animation-delay:2.25s"><circle cx="238.3" cy="314.9" r="5" fill="#00fff2" filter="url(#smglow)"/></g>
  <g class="vertex" style="animation-delay:2.3s"><circle cx="193.0" cy="195.2" r="5" fill="#00fff2" filter="url(#smglow)"/></g>

  <text class="label" x="300" y="45" text-anchor="middle" fill="#ffd700" font-size="13">PYTHON — 95%</text>
  <text class="label" x="475.9" y="172.8" text-anchor="start" fill="#ffd700" font-size="13">AI/ML — 80%</text>
  <text class="label" x="408.7" y="379.7" text-anchor="start" fill="#ffd700" font-size="13">FULL-STACK — 85%</text>
  <text class="label" x="191.3" y="379.7" text-anchor="end" fill="#ffd700" font-size="13">DATABASES — 70%</text>
  <text class="label" x="124.1" y="172.8" text-anchor="end" fill="#ffd700" font-size="13">JAVA — 75%</text>

  <text class="summary" x="300" y="435" text-anchor="middle" fill="#5fe9e0" font-size="12">SYSTEM SYNC: 81% AVERAGE MASTERY</text>
</svg>
