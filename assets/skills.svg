<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glowbar" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family: 'Fira Code', 'Courier New', monospace; }
      .pct{ opacity: 0; animation: fadein 0.5s ease forwards; }
      @keyframes fadein{ to{ opacity: 1 } }
    </style>
  </defs>

  <rect width="900" height="290" fill="#050814"/>

  <!-- Python 95% -->
  <text x="20" y="34" fill="#00fff2" font-size="15">PYTHON</text>
  <rect x="220" y="20" width="660" height="18" rx="9" fill="#111826" stroke="#1c2b3a"/>
  <rect x="220" y="20" height="18" rx="9" fill="url(#fillGrad)" filter="url(#glowbar)">
    <animate attributeName="width" from="0" to="627" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </rect>
  <text class="pct" x="890" y="33" text-anchor="end" fill="#ffd700" font-size="12" style="animation-delay:1.7s">95%</text>

  <!-- Java 75% -->
  <text x="20" y="89" fill="#00fff2" font-size="15">JAVA</text>
  <rect x="220" y="75" width="660" height="18" rx="9" fill="#111826" stroke="#1c2b3a"/>
  <rect x="220" y="75" height="18" rx="9" fill="url(#fillGrad)" filter="url(#glowbar)">
    <animate attributeName="width" from="0" to="495" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </rect>
  <text class="pct" x="890" y="88" text-anchor="end" fill="#ffd700" font-size="12" style="animation-delay:1.9s">75%</text>

  <!-- Full-Stack 85% -->
  <text x="20" y="144" fill="#00fff2" font-size="15">FULL-STACK</text>
  <rect x="220" y="130" width="660" height="18" rx="9" fill="#111826" stroke="#1c2b3a"/>
  <rect x="220" y="130" height="18" rx="9" fill="url(#fillGrad)" filter="url(#glowbar)">
    <animate attributeName="width" from="0" to="561" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </rect>
  <text class="pct" x="890" y="143" text-anchor="end" fill="#ffd700" font-size="12" style="animation-delay:2.1s">85%</text>

  <!-- AI/ML 80% -->
  <text x="20" y="199" fill="#00fff2" font-size="15">AI / ML</text>
  <rect x="220" y="185" width="660" height="18" rx="9" fill="#111826" stroke="#1c2b3a"/>
  <rect x="220" y="185" height="18" rx="9" fill="url(#fillGrad)" filter="url(#glowbar)">
    <animate attributeName="width" from="0" to="528" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </rect>
  <text class="pct" x="890" y="198" text-anchor="end" fill="#ffd700" font-size="12" style="animation-delay:2.3s">80%</text>

  <!-- Databases 70% -->
  <text x="20" y="254" fill="#00fff2" font-size="15">DATABASES</text>
  <rect x="220" y="240" width="660" height="18" rx="9" fill="#111826" stroke="#1c2b3a"/>
  <rect x="220" y="240" height="18" rx="9" fill="url(#fillGrad)" filter="url(#glowbar)">
    <animate attributeName="width" from="0" to="462" dur="1.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.5 1"/>
  </rect>
  <text class="pct" x="890" y="253" text-anchor="end" fill="#ffd700" font-size="12" style="animation-delay:2.5s">70%</text>
</svg>
