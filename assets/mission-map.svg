<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fog" cx="0%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#050814" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <filter id="mmglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .path{ stroke-dasharray:1060; stroke-dashoffset:1060; animation: draw 3.4s ease-out forwards; }
      @keyframes draw{ to{ stroke-dashoffset:0 } }
      .node{ transform-box: fill-box; transform-origin: center; opacity:0; animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
      @keyframes pop{ from{ opacity:0; transform:scale(0) } to{ opacity:1; transform:scale(1) } }
      .label{ opacity:0; animation: fadein .5s ease forwards; }
      @keyframes fadein{ to{ opacity:1 } }
      .here{ animation: herepulse 1.8s ease-in-out infinite; animation-delay:3.5s; }
      @keyframes herepulse{ 0%,100%{ opacity:.9; transform:scale(1) } 50%{ opacity:.15; transform:scale(1.7) } }
      .twinkle{ animation: tw 3s ease-in-out infinite; }
      @keyframes tw{ 0%,100%{ opacity:.15 } 50%{ opacity:.8 } }
      .fogtext{ animation: fogblink 2.2s ease-in-out infinite; animation-delay:3.6s; opacity:0; }
      @keyframes fogblink{ 0%,100%{ opacity:.15 } 50%{ opacity:.65 } }
    </style>
  </defs>

  <rect width="900" height="420" fill="#050814"/>

  <!-- faint terrain contour rings for texture -->
  <g stroke="#00fff2" stroke-opacity="0.06" fill="none">
    <circle cx="150" cy="380" r="60"/>
    <circle cx="150" cy="380" r="100"/>
    <circle cx="780" cy="60" r="70"/>
    <circle cx="780" cy="60" r="115"/>
  </g>
  <g class="twinkle"><circle cx="90" cy="60" r="1.6" fill="#00fff2"/></g>
  <g class="twinkle" style="animation-delay:0.5s"><circle cx="420" cy="60" r="1.6" fill="#00fff2"/></g>
  <g class="twinkle" style="animation-delay:1s"><circle cx="600" cy="380" r="1.6" fill="#00fff2"/></g>
  <g class="twinkle" style="animation-delay:1.5s"><circle cx="750" cy="350" r="1.6" fill="#ffd700"/></g>
  <g class="twinkle" style="animation-delay:2s"><circle cx="280" cy="380" r="1.6" fill="#ffd700"/></g>

  <!-- compass rose -->
  <g transform="translate(840,40)" stroke="#00fff2" stroke-opacity="0.35" fill="none">
    <circle r="20"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
  </g>
  <text x="840" y="10" text-anchor="middle" fill="#00fff2" opacity="0.5" font-size="9">N</text>

  <path id="questpath" class="path" d="M50,320 L200,180 L350,320 L500,160 L650,320 L800,180" stroke="#00fff2" stroke-width="2.5" fill="none" stroke-linejoin="round" filter="url(#mmglow)"/>

  <circle r="5" fill="#ffffff" filter="url(#mmglow)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="6s" begin="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="6s" begin="3.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#questpath"/>
    </animateMotion>
  </circle>

  <!-- Node 0 -->
  <g class="node" style="animation-delay:0s">
    <circle cx="50" cy="320" r="11" fill="#0d1420" stroke="#00fff2" stroke-width="2" filter="url(#mmglow)"/>
    <text x="50" y="325" text-anchor="middle" font-size="12">🎓</text>
  </g>
  <text class="label" x="50" y="360" text-anchor="middle" fill="#ffd700" font-size="11" style="animation-delay:0.5s">Engineering Begins</text>

  <!-- Node 1 -->
  <g class="node" style="animation-delay:0.6s">
    <circle cx="200" cy="180" r="11" fill="#0d1420" stroke="#00fff2" stroke-width="2" filter="url(#mmglow)"/>
    <text x="200" y="185" text-anchor="middle" font-size="12">📜</text>
  </g>
  <text class="label" x="200" y="150" text-anchor="middle" fill="#ffd700" font-size="11" style="animation-delay:1.1s">GUVI &amp; IBM Certified</text>

  <!-- Node 2 -->
  <g class="node" style="animation-delay:1.2s">
    <circle cx="350" cy="320" r="11" fill="#0d1420" stroke="#00fff2" stroke-width="2" filter="url(#mmglow)"/>
    <text x="350" y="325" text-anchor="middle" font-size="12">🌾</text>
  </g>
  <text class="label" x="350" y="360" text-anchor="middle" fill="#ffd700" font-size="11" style="animation-delay:1.7s">crop_recommendation</text>

  <!-- Node 3 -->
  <g class="node" style="animation-delay:1.9s">
    <circle cx="500" cy="160" r="11" fill="#0d1420" stroke="#00fff2" stroke-width="2" filter="url(#mmglow)"/>
    <text x="500" y="165" text-anchor="middle" font-size="12">🏥</text>
  </g>
  <text class="label" x="500" y="130" text-anchor="middle" fill="#ffd700" font-size="11" style="animation-delay:2.4s">MED_CHAT</text>

  <!-- Node 4 -->
  <g class="node" style="animation-delay:2.6s">
    <circle cx="650" cy="320" r="11" fill="#0d1420" stroke="#00fff2" stroke-width="2" filter="url(#mmglow)"/>
    <text x="650" y="325" text-anchor="middle" font-size="12">🤟</text>
  </g>
  <text class="label" x="650" y="360" text-anchor="middle" fill="#ffd700" font-size="11" style="animation-delay:3.1s">SIBI_AI</text>

  <!-- Node 5 - current, YOU ARE HERE -->
  <circle class="here" cx="800" cy="180" r="15" fill="none" stroke="#ffd700" stroke-width="2"/>
  <g class="node" style="animation-delay:3.2s">
    <circle cx="800" cy="180" r="13" fill="#0d1420" stroke="#ffd700" stroke-width="2.5" filter="url(#mmglow)"/>
    <text x="800" y="186" text-anchor="middle" font-size="14">🏆</text>
  </g>
  <text class="label" x="800" y="150" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:3.7s">YOU ARE HERE — 3x Champion</text>

  <!-- fog of war -->
  <rect x="800" y="0" width="100" height="420" fill="url(#fog)"/>
  <text class="fogtext" x="855" y="260" text-anchor="middle" fill="#5fe9e0" font-size="10">NEXT QUEST</text>
  <text class="fogtext" x="855" y="275" text-anchor="middle" fill="#5fe9e0" font-size="10">LOADING...</text>
</svg>
