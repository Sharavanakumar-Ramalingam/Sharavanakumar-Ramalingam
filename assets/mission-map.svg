<svg width="650" height="600" viewBox="0 0 650 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="mmglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .path{ stroke-dasharray:1439.7; stroke-dashoffset:1439.7; animation: draw 3.5s ease-out forwards; }
      @keyframes draw{ to{ stroke-dashoffset:0 } }
      .node{ transform-box: fill-box; transform-origin: center; opacity:0; animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
      @keyframes pop{ from{ opacity:0; transform:scale(0) } to{ opacity:1; transform:scale(1) } }
      .label{ opacity:0; animation: fadein .5s ease forwards; }
      @keyframes fadein{ to{ opacity:1 } }
      .here{ animation: herepulse 1.8s ease-in-out infinite; animation-delay:3.5s; transform-box: fill-box; transform-origin: center; }
      @keyframes herepulse{ 0%,100%{ opacity:.9; transform:scale(1) } 50%{ opacity:.15; transform:scale(1.6) } }
      .twinkle{ animation: tw 3s ease-in-out infinite; }
      @keyframes tw{ 0%,100%{ opacity:.15 } 50%{ opacity:.8 } }
      .fogpath{ opacity:0; animation: fogin 1.5s ease forwards; animation-delay:3.6s; }
      @keyframes fogin{ to{ opacity:1 } }
      .fogtext{ animation: fogblink 2.2s ease-in-out infinite; animation-delay:4.4s; opacity:0; }
      @keyframes fogblink{ 0%,100%{ opacity:.15 } 50%{ opacity:.65 } }
      .hubring{ transform-box: fill-box; transform-origin: center; animation: hubrot 10s linear infinite; }
      @keyframes hubrot{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
      .hubcore{ animation: hubpulse 2s ease-in-out infinite; }
      @keyframes hubpulse{ 0%,100%{ opacity:.6 } 50%{ opacity:1 } }
    </style>
  </defs>

  <rect width="650" height="600" fill="#050814"/>

  <g class="twinkle"><circle cx="70" cy="60" r="1.6" fill="#00fff2"/></g>
  <g class="twinkle" style="animation-delay:0.5s"><circle cx="580" cy="90" r="1.6" fill="#00fff2"/></g>
  <g class="twinkle" style="animation-delay:1s"><circle cx="60" cy="520" r="1.6" fill="#ffd700"/></g>
