<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .line{ opacity:0; animation: materialize 0.5s ease forwards; }
      @keyframes materialize{ from{opacity:0; transform:translateX(-10px)} to{opacity:1; transform:translateX(0)} }
      .cursor{ animation: blink 0.9s step-end infinite; animation-delay: 3.4s; opacity:0; }
      @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0} }
      .dot{ animation: dotpulse 2.4s ease-in-out infinite; }
      @keyframes dotpulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="230" rx="10" fill="#060a14" stroke="#00fff2" stroke-opacity="0.35"/>
  <rect x="0" y="0" width="900" height="32" rx="10" fill="#0d1420"/>
  <rect x="0" y="20" width="900" height="12" fill="#0d1420"/>
  <circle class="dot" cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle class="dot" cx="40" cy="16" r="5" fill="#ffbd2e" style="animation-delay:0.3s"/>
  <circle class="dot" cx="60" cy="16" r="5" fill="#27c93f" style="animation-delay:0.6s"/>
  <text x="450" y="21" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.6">jarvis@sharavana:~$</text>

  <g fill="#00fff2" font-size="15" filter="url(#tglow)">
    <text class="line" x="24" y="65" style="animation-delay:0.2s">&gt; SYSTEM BOOT SEQUENCE -------------------------------------- [OK]</text>
    <text class="line" x="24" y="95" fill="#c9d1d9" style="animation-delay:1.0s">  operator&#160;&#160;&#160;&#160;&#160;: Sharavanakumar Ramalingam</text>
    <text class="line" x="24" y="120" fill="#c9d1d9" style="animation-delay:1.5s">  role&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;: Aspiring AI/ML Developer | Full-Stack Engineer</text>
    <text class="line" x="24" y="145" fill="#c9d1d9" style="animation-delay:2.0s">  clearance&#160;&#160;&#160;: GUVI &amp; IBM Certified · Campus Ambassador @ HCL GUVI</text>
    <text class="line" x="24" y="170" fill="#ffd700" style="animation-delay:2.5s">  achievements: 2x Symposium Winner · 3x Hackathon Champion</text>
    <text class="line" x="24" y="200" style="animation-delay:3.2s">&gt; ALL SYSTEMS NOMINAL. STANDING BY FOR MISSION BRIEFING. ---- [OK]</text>
  </g>

  <rect class="cursor" x="24" y="207" width="9" height="14" fill="#00fff2"/>
</svg>
