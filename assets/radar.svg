<svg width="460" height="500" viewBox="0 0 460 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sweepGradTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="rglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .sweep{ transform-box: fill-box; transform-origin: center; animation: sweep 4s linear infinite; }
      .sweepTrail{ transform-box: fill-box; transform-origin: center; animation: sweep 4s linear infinite; animation-delay:-0.18s; }
      @keyframes sweep{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
      .blip{ animation: ping 3.6s ease-in-out infinite; }
      @keyframes ping{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
      .lock{ opacity:0; animation: lockcycle 10s ease-in-out infinite; }
      @keyframes lockcycle{ 0%,100%{ opacity:0 } 2%{ opacity:1 } 16%{ opacity:1 } 19%{ opacity:0 } }
    </style>
  </defs>

  <rect width="460" height="500" fill="#050814"/>

  <!-- outer bezel with tick marks -->
  <g transform="translate(230,210)">
    <circle r="188" fill="none" stroke="#00fff2" stroke-opacity="0.25"/>
    <g stroke="#00fff2" stroke-opacity="0.3">
      <line x1="0" y1="-185" x2="0" y2="-178"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(15)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(30)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(45)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(60)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(75)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(90)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(105)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(120)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(135)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(150)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(165)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(180)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(195)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(210)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(225)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(240)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(255)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(270)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(285)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(300)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(315)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(330)"/>
      <line x1="0" y1="-185" x2="0" y2="-178" transform="rotate(345)"/>
    </g>
  </g>

  <circle cx="230" cy="210" r="175" fill="url(#radarBg)" stroke="#00fff2" stroke-opacity="0.3"/>
  <circle cx="230" cy="210" r="132" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <circle cx="230" cy="210" r="88" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <circle cx="230" cy="210" r="44" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <line x1="45" y1="210" x2="415" y2="210" stroke="#00fff2" stroke-opacity="0.12"/>
  <line x1="230" y1="25" x2="230" y2="395" stroke="#00fff2" stroke-opacity="0.12"/>

  <!-- quadrant labels -->
  <text x="230" y="42" text-anchor="middle" fill="#5fe9e0" font-size="10" opacity="0.6">AI / ML</text>
  <text x="405" y="214" text-anchor="end" fill="#5fe9e0" font-size="10" opacity="0.6">WEB</text>
  <text x="230" y="385" text-anchor="middle" fill="#5fe9e0" font-size="10" opacity="0.6">DSA</text>
  <text x="55" y="214" text-anchor="start" fill="#5fe9e0" font-size="10" opacity="0.6">SYSTEMS</text>

  <path class="sweepTrail" d="M230,210 L230,25 A185,185 0 0,1 375,120 Z" fill="url(#sweepGradTrail)"/>
  <path class="sweep" d="M230,210 L230,25 A185,185 0 0,1 375,120 Z" fill="url(#sweepGrad)"/>

  <!-- contact lines + blips -->
  <g stroke="#00fff2" stroke-opacity="0.25" stroke-dasharray="2 3">
    <line x1="230" y1="210" x2="165" y2="150"/>
    <line x1="230" y1="210" x2="310" y2="175"/>
    <line x1="230" y1="210" x2="150" y2="285"/>
    <line x1="230" y1="210" x2="295" y2="305"/>
    <line x1="230" y1="210" x2="235" y2="245"/>
  </g>

  <circle class="blip" cx="165" cy="150" r="4.5" fill="#00fff2" filter="url(#rglow)"/>
  <text x="175" y="146" fill="#ffd700" font-size="12">PYTHON</text>

  <circle class="blip" cx="310" cy="175" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:0.5s"/>
  <text x="320" y="171" fill="#ffd700" font-size="12">AI / ML</text>

  <circle class="blip" cx="150" cy="285" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:1s"/>
  <text x="160" y="281" fill="#ffd700" font-size="12">REACT</text>

  <circle class="blip" cx="295" cy="305" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:1.5s"/>
  <text x="305" y="301" fill="#ffd700" font-size="12">BACKEND</text>

  <circle class="blip" cx="235" cy="245" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:2s"/>
  <text x="245" y="241" fill="#ffd700" font-size="12">DSA</text>

  <circle cx="230" cy="210" r="4.5" fill="#ffffff"/>

  <!-- cycling target-lock readout -->
  <text class="lock" x="230" y="435" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:0s">TARGET LOCKED: PYTHON</text>
  <text class="lock" x="230" y="435" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:2s">TARGET LOCKED: AI / ML</text>
  <text class="lock" x="230" y="435" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:4s">TARGET LOCKED: REACT</text>
  <text class="lock" x="230" y="435" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:6s">TARGET LOCKED: BACKEND</text>
  <text class="lock" x="230" y="435" text-anchor="middle" fill="#00fff2" font-size="12" style="animation-delay:8s">TARGET LOCKED: DSA</text>

  <text x="230" y="465" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.75">SCANNING FOR SKILLS...</text>
</svg>
