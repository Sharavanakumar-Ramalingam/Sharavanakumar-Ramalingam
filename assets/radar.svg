<svg width="500" height="540" viewBox="0 0 500 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sweepGradTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="rglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .sweep{ transform-origin: 250px 225px; animation: sweep 4s linear infinite; }
      .sweepTrail{ transform-origin: 250px 225px; animation: sweep 4s linear infinite; animation-delay:-0.18s; }
      @keyframes sweep{ from{ transform:rotate(0deg) } to{ transform:rotate(360deg) } }
      .blip{ animation: ping 3.6s ease-in-out infinite; }
      @keyframes ping{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
      .lock{ opacity:0; animation: lockcycle 10s ease-in-out infinite; }
      @keyframes lockcycle{ 0%,100%{ opacity:0 } 2%{ opacity:1 } 16%{ opacity:1 } 19%{ opacity:0 } }
    </style>
  </defs>

  <rect width="500" height="540" fill="#050814"/>

  <g transform="translate(250,225)">
    <circle r="188" fill="none" stroke="#00fff2" stroke-opacity="0.3" stroke-width="1.5"/>
    <g stroke="#00fff2" stroke-opacity="0.45" stroke-width="1.5">
      <line x1="0" y1="-186" x2="0" y2="-176"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(15)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(30)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(45)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(60)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(75)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(90)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(105)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(120)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(135)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(150)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(165)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(180)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(195)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(210)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(225)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(240)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(255)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(270)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(285)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(300)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(315)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(330)"/>
      <line x1="0" y1="-186" x2="0" y2="-176" transform="rotate(345)"/>
    </g>
  </g>

  <circle cx="250" cy="225" r="170" fill="url(#radarBg)" stroke="#00fff2" stroke-opacity="0.3"/>
  <circle cx="250" cy="225" r="128" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <circle cx="250" cy="225" r="85" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <circle cx="250" cy="225" r="43" fill="none" stroke="#00fff2" stroke-opacity="0.16"/>
  <line x1="80" y1="225" x2="420" y2="225" stroke="#00fff2" stroke-opacity="0.12"/>
  <line x1="250" y1="55" x2="250" y2="395" stroke="#00fff2" stroke-opacity="0.12"/>

  <text x="250" y="30" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.7">AI / ML</text>
  <text x="440" y="229" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.7">WEB</text>
  <text x="250" y="415" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.7">DSA</text>
  <text x="60" y="229" text-anchor="middle" fill="#5fe9e0" font-size="11" opacity="0.7">SYSTEMS</text>

  <path class="sweepTrail" d="M250,225 L250,55 A170,170 0 0,1 390,130 Z" fill="url(#sweepGradTrail)"/>
  <path class="sweep" d="M250,225 L250,55 A170,170 0 0,1 390,130 Z" fill="url(#sweepGrad)"/>

  <g stroke="#00fff2" stroke-opacity="0.3" stroke-dasharray="2 3">
    <line x1="250" y1="225" x2="185" y2="162"/>
    <line x1="250" y1="225" x2="325" y2="188"/>
    <line x1="250" y1="225" x2="170" y2="300"/>
    <line x1="250" y1="225" x2="310" y2="320"/>
    <line x1="250" y1="225" x2="255" y2="260"/>
  </g>

  <circle class="blip" cx="185" cy="162" r="4.5" fill="#00fff2" filter="url(#rglow)"/>
  <text x="195" y="158" fill="#ffd700" font-size="12">PYTHON</text>

  <circle class="blip" cx="325" cy="188" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:0.5s"/>
  <text x="335" y="184" fill="#ffd700" font-size="12">AI / ML</text>

  <circle class="blip" cx="170" cy="300" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:1s"/>
  <text x="180" y="296" fill="#ffd700" font-size="12">REACT</text>

  <circle class="blip" cx="310" cy="320" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:1.5s"/>
  <text x="285" y="336" fill="#ffd700" font-size="12">BACKEND</text>

  <circle class="blip" cx="255" cy="260" r="4.5" fill="#00fff2" filter="url(#rglow)" style="animation-delay:2s"/>
  <text x="265" y="256" fill="#ffd700" font-size="12">DSA</text>

  <circle cx="250" cy="225" r="4.5" fill="#ffffff"/>

  <text class="lock" x="250" y="460" text-anchor="middle" fill="#00fff2" font-size="13" style="animation-delay:0s">TARGET LOCKED: PYTHON</text>
  <text class="lock" x="250" y="460" text-anchor="middle" fill="#00fff2" font-size="13" style="animation-delay:2s">TARGET LOCKED: AI / ML</text>
  <text class="lock" x="250" y="460" text-anchor="middle" fill="#00fff2" font-size="13" style="animation-delay:4s">TARGET LOCKED: REACT</text>
  <text class="lock" x="250" y="460" text-anchor="middle" fill="#00fff2" font-size="13" style="animation-delay:6s">TARGET LOCKED: BACKEND</text>
  <text class="lock" x="250" y="460" text-anchor="middle" fill="#00fff2" font-size="13" style="animation-delay:8s">TARGET LOCKED: DSA</text>

  <text x="250" y="495" text-anchor="middle" fill="#5fe9e0" font-size="12" opacity="0.75">SCANNING FOR SKILLS...</text>
</svg>
