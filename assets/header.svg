<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family: 'Fira Code', 'Courier New', monospace; }
      .flicker{ animation: flick 3.4s infinite ease-in-out; }
      @keyframes flick{
        0%,100%{opacity:1} 47%{opacity:1} 49%{opacity:.5} 51%{opacity:1}
        75%{opacity:.85} 77%{opacity:1}
      }
      .ring1{ transform-origin: 90px 110px; animation: rot1 12s linear infinite; }
      .ring2{ transform-origin: 90px 110px; animation: rot2 8s linear infinite; }
      @keyframes rot1{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes rot2{ from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
      .core{ animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse{ 0%,100%{opacity:.65} 50%{opacity:1} }
      .sweep{ animation: sweep 4.5s linear infinite; }
      @keyframes sweep{ from{transform:translateX(-40px)} to{transform:translateX(900px)} }
      .subtitle{ animation: reveal 2.2s steps(44,end) forwards; }
      @keyframes reveal{ from{clip-path: inset(0 100% 0 0)} to{clip-path: inset(0 0 0 0)} }
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <g stroke="#00fff2" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="28" x2="240" y2="28"/>
    <line x1="240" y1="28" x2="268" y2="56"/>
    <line x1="0" y1="192" x2="210" y2="192"/>
    <line x1="640" y1="18" x2="900" y2="18"/>
    <line x1="700" y1="202" x2="900" y2="202"/>
  </g>

  <g class="ring1">
    <circle cx="90" cy="110" r="45" fill="none" stroke="#00fff2" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.7"/>
  </g>
  <g class="ring2">
    <circle cx="90" cy="110" r="32" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  </g>
  <circle class="core" cx="90" cy="110" r="11" fill="#00fff2" filter="url(#glow)"/>

  <rect class="sweep" x="0" y="0" width="6" height="220" fill="url(#scanGrad)"/>

  <text x="480" y="102" text-anchor="middle" font-size="42" font-weight="700" fill="#00fff2" filter="url(#glow)" class="flicker">SHARAVANA KUMAR</text>

  <text x="480" y="142" text-anchor="middle" font-size="16" fill="#ffd700" class="subtitle">AI/ML ENGINEER · FULL-STACK DEVELOPER · LEVEL 42</text>

  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#5fe9e0" opacity="0.75">[ SYSTEM ONLINE ]&#160;&#160;&#160;[ ALL MODULES NOMINAL ]</text>
</svg>
