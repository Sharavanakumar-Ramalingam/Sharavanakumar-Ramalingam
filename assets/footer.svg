<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="fscan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00fff2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .fring{ transform-box: fill-box; transform-origin: center; animation: frot 16s linear infinite; }
      @keyframes frot{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      .fcore{ animation: fpulse 2.4s ease-in-out infinite; }
      @keyframes fpulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
      .fsweep{ animation: fsweep 5s linear infinite; }
      @keyframes fsweep{ from{transform:translateX(-40px)} to{transform:translateX(900px)} }
    </style>
  </defs>

  <rect width="900" height="150" fill="url(#fbg)"/>
  <rect class="fsweep" x="0" y="0" width="6" height="150" fill="url(#fscan)"/>

  <g class="fring">
    <circle cx="810" cy="75" r="30" fill="none" stroke="#00fff2" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  </g>
  <circle class="fcore" cx="810" cy="75" r="8" fill="#00fff2" filter="url(#fglow)"/>

  <text x="420" y="70" text-anchor="middle" font-size="22" fill="#00fff2" filter="url(#fglow)">MISSION LOG SAVED</text>
  <text x="420" y="98" text-anchor="middle" font-size="13" fill="#ffd700">Thanks for stopping by, operator. Star the repo to bookmark this HUD.</text>

  <g stroke="#00fff2" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="130" x2="200" y2="130"/>
    <line x1="700" y1="20" x2="900" y2="20"/>
  </g>
</svg>
