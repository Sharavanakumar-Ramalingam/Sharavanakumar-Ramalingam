<svg width="220" height="250" viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{ font-family:'Fira Code','Courier New',monospace; }
      .r1{ transform-box: fill-box; transform-origin: center; animation: rot 10s linear infinite; }
      .r2{ transform-box: fill-box; transform-origin: center; animation: rotrev 14s linear infinite; }
      .r3{ transform-box: fill-box; transform-origin: center; animation: rot 22s linear infinite; }
      @keyframes rot{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes rotrev{ from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
      .core{ animation: corepulse 1.8s ease-in-out infinite; }
      @keyframes corepulse{ 0%,100%{opacity:.7} 50%{opacity:1} }
      .label{ animation: blink2 2s step-end infinite; }
      @keyframes blink2{ 0%,100%{opacity:1} 50%{opacity:.4} }
    </style>
  </defs>

  <circle cx="110" cy="110" r="95" fill="#050814"/>

  <g class="r3">
    <circle cx="110" cy="110" r="90" fill="none" stroke="#1c2b3a" stroke-width="1"/>
    <circle cx="110" cy="110" r="90" fill="none" stroke="#00fff2" stroke-width="2" stroke-dasharray="10 240" opacity="0.8"/>
  </g>

  <g class="r1">
    <circle cx="110" cy="110" r="70" fill="none" stroke="#00fff2" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.6"/>
    <circle cx="110" cy="40" r="3.5" fill="#00fff2" filter="url(#cglow)"/>
  </g>

  <g class="r2">
    <circle cx="110" cy="110" r="52" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.6"/>
    <circle cx="162" cy="110" r="3" fill="#ffd700" filter="url(#cglow)"/>
  </g>

  <circle class="core" cx="110" cy="110" r="16" fill="#00fff2" filter="url(#cglow)"/>
  <circle cx="110" cy="110" r="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <text x="110" y="235" text-anchor="middle" fill="#5fe9e0" font-size="11" class="label">CORE STATUS: ACTIVE</text>
</svg>
